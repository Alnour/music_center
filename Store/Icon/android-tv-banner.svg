<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android TV / Fire OS launcher banner, 320x180 (drawable-xhdpi). TV stores require the
  app's name on the banner. The fretboard is the adaptive icon's drawing on its 1024 grid,
  scaled to 0.17 and placed on the left; the name sits on the right.
  Render: rsvg-convert -w 320 -h 180 android-tv-banner.svg (and -w 1280 -h 720 for stores).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#171C25"/>
  <g transform="translate(2.1,3) scale(0.17)">
    <path fill="#D3D7E0" d="M137,202h26v620h-26z"/>
    <path fill="#5C6475" d="M387,202h10v620h-10z M628,202h9v620h-9z M869,202h9v620h-9z"/>
    <path fill="#7D8596" d="M150,196h724v12h-724z M150,320h724v12h-724z M150,445h724v10h-724z M150,570h724v8h-724z M150,695h724v6h-724z M150,819h724v6h-724z"/>
    <g fill="#9FABC2">
      <circle cx="271" cy="202" r="54"/>
      <circle cx="512" cy="326" r="54"/>
      <circle cx="753" cy="326" r="54"/>
      <circle cx="753" cy="450" r="54"/>
      <circle cx="271" cy="574" r="54"/>
      <circle cx="753" cy="574" r="54"/>
      <circle cx="512" cy="698" r="54"/>
      <circle cx="271" cy="822" r="54"/>
      <circle cx="753" cy="822" r="54"/>
    </g>
    <g fill="#F5CB60">
      <circle cx="753" cy="202" r="54"/>
      <circle cx="271" cy="450" r="54"/>
      <circle cx="753" cy="698" r="54"/>
    </g>
  </g>
  <text x="232" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="40" fill="#E6E9EF">Scales</text>
</svg>
